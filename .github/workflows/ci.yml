name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

  frontend:
    name: Frontend (Next.js build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      - name: Start API (seed demo)
        working-directory: backend
        env:
          SEED_ENABLED: "true"
          AUTH_RATE_LIMIT_ENABLED: "false"
          PORT: "8081"
          JWT_COOKIE_SECURE: "false"
          CORS_ORIGINS: "http://127.0.0.1:3100,http://localhost:3100,http://127.0.0.1:3000,http://localhost:3000"
        run: |
          nohup java -jar target/jee-platform-0.0.1-SNAPSHOT.jar > /tmp/jee-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/api/v1/health >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          cat /tmp/jee-api.log
          exit 1

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Get Playwright version
        id: pw-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          # --with-deps runs apt. A 3 min kill left dpkg locked, so the retry failed with code 100.
          if ! timeout --kill-after=20 360 npx playwright install --with-deps chromium; then
            echo "playwright install failed; releasing apt lock before retry"
            sudo killall apt-get apt 2>/dev/null || true
            sleep 3
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
            timeout --kill-after=20 240 npx playwright install --with-deps chromium
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8081

      - name: Run smoke e2e
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_PORT: "3100"
          E2E_BASE_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8081

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
