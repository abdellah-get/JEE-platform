spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:jee-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.h2.console.enabled=false

app.jwt.secret=jee-ensem-test-secret-change-me-32chars-min
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.jwt.cookie-secure=false
app.seed.enabled=false

# High ceiling so existing auth flows do not trip the limiter
app.auth.rate-limit.enabled=true
app.auth.rate-limit.max-requests=100
app.auth.rate-limit.window-seconds=60
