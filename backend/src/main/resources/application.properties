spring.application.name=jee-platform
# 8080 often used by Oracle TNS Listener on Windows; Render injects PORT
server.port=${PORT:8081}

# Local by default (H2 console). Production: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

# --- Datasource ---
# Local default: H2 in-memory (PostgreSQL compatibility mode)
# Neon/Postgres: set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, DATABASE_DRIVER
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:jee;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# Schema owned by Flyway — Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 console OFF by default — enabled only in application-local.properties
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# --- JWT ---
# Override in production via JWT_SECRET (min 32 chars). Default secret rejected when prod-like.
app.jwt.secret=${JWT_SECRET:jee-ensem-dev-secret-change-me-32chars-min}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Comma-separated origins (local + Vercel in prod)
# 3001 = Next.js when 3000 is already taken by another app
# Escaped commas in ${…:default} so Spring keeps the full default list.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000\,http://localhost:3001\,http://localhost:3100\,http://127.0.0.1:3000\,http://127.0.0.1:3001\,http://127.0.0.1:3100}

# Demo seed (users/projects/tasks/announcements) — local only by default
app.seed.enabled=${SEED_ENABLED:false}

# Project attachments (local FS by default — free tier; path persists on Render disk if configured)
app.attachments.storage-path=${ATTACHMENTS_PATH:./data/attachments}
app.attachments.max-size-bytes=${ATTACHMENTS_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Auth rate limit (login / register / forgot-password) — per IP per endpoint
app.auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:20}
app.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

# Registration: domain allowlist (empty = no domain filter) + optional bureau approval
app.registration.allowed-email-domains=${REGISTRATION_ALLOWED_DOMAINS:ensem.ac.ma,ensem.jee}
app.registration.require-approval=${REGISTRATION_REQUIRE_APPROVAL:false}

# Password reset (email logged locally unless spring.mail.host is set)
app.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:60}
app.password-reset.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:noreply@ensem.jee}
# Optional SMTP (Brevo, etc.) — when unset, LoggingMailService logs the reset link
# spring.mail.host=${MAIL_HOST:}
# spring.mail.port=${MAIL_PORT:587}
# spring.mail.username=${MAIL_USERNAME:}
# spring.mail.password=${MAIL_PASSWORD:}
