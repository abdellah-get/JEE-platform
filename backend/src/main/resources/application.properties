spring.application.name=jee-platform
# 8080 often used by Oracle TNS Listener on Windows
server.port=8081

# --- Datasource ---
# Local default: H2 in-memory (PostgreSQL compatibility mode)
# Neon/Postgres: set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, DATABASE_DRIVER
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:jee;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# Schema owned by Flyway — Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 console (local only) → http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
