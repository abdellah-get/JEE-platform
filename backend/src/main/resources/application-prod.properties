# Activate with SPRING_PROFILES_ACTIVE=prod (required on Render).

spring.h2.console.enabled=false

# Secure cookies over HTTPS
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# Never enable demo seed in production (ProductionSafetyValidator refuses true)
app.seed.enabled=${SEED_ENABLED:false}

# Closed registration by default in prod (override only if you accept the risk)
app.registration.require-approval=${REGISTRATION_REQUIRE_APPROVAL:true}
app.registration.allowed-email-domains=${REGISTRATION_ALLOWED_DOMAINS:ensem.ac.ma,ensem.jee}
